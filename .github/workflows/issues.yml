name: MarketIt issues

on:
  issues:
    types: [opened, edited, closed, reopened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  ack:
    # Instant receipt: react 👍 to a new project issue or a comment on one, before the slower work starts.
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'issue_comment' || github.event.action == 'opened' || github.event.action == 'edited' || github.event.action == 'reopened') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association) &&
      (contains(github.event.issue.labels.*.name, 'marketit-item') ||
       contains(github.event.issue.labels.*.name, 'marketit-approvals') ||
       contains(github.event.issue.body, 'ideas.lego.com'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: React 👍
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          if [ -n "$COMMENT" ]; then
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT/reactions" -f content=+1 --silent
          else
            gh api -X POST "repos/$REPO/issues/$ISSUE/reactions" -f content=+1 --silent
          fi

  sync:
    concurrency:
      group: marketit-state
      cancel-in-progress: false
    # Every run catches up on ALL unprocessed issues/comments, so nothing is lost even
    # if GitHub cancels a queued run of this workflow.
    if: >-
      github.event.sender.type != 'Bot' &&
      (contains(github.event.issue.labels.*.name, 'marketit-item') ||
       contains(github.event.issue.labels.*.name, 'marketit-approvals') ||
       contains(github.event.issue.body, 'ideas.lego.com'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install browser (for JavaScript-heavy pages like Lego Ideas)
        run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -m marketit sync
      - name: Publish anything just approved
        run: python -m marketit publish
      - if: always()
        run: scripts/commit-state.sh "issue activity [skip ci]"
