name: 🧱 Promote a LEGO Ideas project
description: Paste a LEGO Ideas project link and MarketIt promotes it on social media automatically.
title: "Promote: "
labels: ["marketit-item"]
body:
  - type: input
    id: link
    attributes:
      label: LEGO Ideas link
      description: The project page, e.g. https://ideas.lego.com/projects/…
      placeholder: https://ideas.lego.com/projects/
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional instructions in plain English. The AI follows them.
      placeholder: |
        e.g. Aim at castle fans and adult LEGO collectors. Also celebrate 1,500 supporters.
        Mention the working drawbridge. Post more often in the last month.
