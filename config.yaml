# MarketIt settings. Secrets (API keys, passwords) never go here —
# add them as GitHub Actions secrets (see README.md).

llm:
  # Tried in order. Providers without a key are skipped; if one fails
  # (e.g. free-tier rate limit) the next one is used.
  providers: [gemini, groq, ollama, claude]
  models:
    gemini: gemini-2.5-flash
    groq: llama-3.3-70b-versatile
    ollama: llama3.1
    claude: claude-opus-5-5

images:
  # Used when an item's image mode is "ai" (or "auto" with no photos).
  # pollinations: free, no account needed
  # cloudflare: free daily allowance, needs CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN
  # none: never generate; fall back to template cards
  ai_provider: pollinations

approvals:
  # Number of posts you approve by hand before MarketIt goes fully automatic.
  first_n: 5

# A channel is used when its secrets are set, unless enabled: false.
# daily_cap = max regular posts per day on that channel (milestone posts are extra).
channels:
  bluesky:   {daily_cap: 3}
  mastodon:  {daily_cap: 3}
  pinterest: {daily_cap: 5}
  threads:   {daily_cap: 3}
  instagram: {daily_cap: 1}
  facebook:  {daily_cap: 2}
  telegram:  {daily_cap: 2}
  discord:   {daily_cap: 2}
  x:         {daily_cap: 2, enabled: false}

posting:
  explore_rate: 0.2              # share of posts that try a non-winning style
  min_hours_between_same_item: 20
  stats_every_hours: 20

reddit:
  drafts: true                   # include Reddit drafts (to post by hand) in intake replies

meta:
  graph_version: v23.0           # Facebook/Instagram Graph API version

media:
  # Instagram and Threads need a public image URL. For a public GitHub repo
  # this is worked out automatically; for a private repo, set a base URL
  # where data/media/ is served, or leave those channels off.
  public_base_url: null
  keep_days: 45

github:
  # Only these people can add items or approve posts via issues.
  allowed_associations: [OWNER, MEMBER, COLLABORATOR]
